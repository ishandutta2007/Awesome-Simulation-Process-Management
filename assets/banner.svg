<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes dash {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes gridFade {
      0% { opacity: 0.15; }
      50% { opacity: 0.3; }
      100% { opacity: 0.15; }
    }

    .bg-grid { stroke: #334155; stroke-width: 1; opacity: 0.2; animation: gridFade 4s ease-in-out infinite; }
    .flow-line { stroke: url(#cyanGrad); stroke-width: 2.5; stroke-dasharray: 8, 8; animation: dash 8s linear infinite; }
    .flow-line-purple { stroke: url(#purpleGrad); stroke-width: 2; stroke-dasharray: 6, 6; animation: dash 12s linear infinite reverse; }
    .node-hpc { animation: floatNode 5s ease-in-out infinite; }
    .node-spdm { animation: floatNode 6s ease-in-out 1s infinite; }
    .node-cae { animation: floatNode 5.5s ease-in-out 0.5s infinite; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); letter-spacing: 1px; }
    .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; letter-spacing: 0.5px; }
    .badge-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Connection Lines -->
  <path d="M 150,120 Q 300,60 600,100 T 1050,120" fill="none" class="flow-line"/>
  <path d="M 100,300 Q 350,360 600,300 T 1100,280" fill="none" class="flow-line-purple"/>
  <path d="M 220,180 L 980,180" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path d="M 220,180 L 980,180" fill="none" class="flow-line"/>

  <!-- Left Simulation Process Nodes -->
  <g class="node-hpc" transform="translate(0,0)">
    <circle cx="150" cy="120" r="32" fill="url(#cyanGrad)" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="150" cy="120" r="22" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3"/>
    <text x="150" y="125" text-anchor="middle" class="badge-text">HPC</text>
  </g>

  <g class="node-spdm" transform="translate(0,0)">
    <circle cx="100" cy="300" r="28" fill="url(#purpleGrad)" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="100" cy="300" r="18" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="3"/>
    <text x="100" y="304" text-anchor="middle" class="badge-text">SPDM</text>
  </g>

  <!-- Right Simulation Process Nodes -->
  <g class="node-cae" transform="translate(0,0)">
    <circle cx="1050" cy="120" r="32" fill="url(#blueGrad)" opacity="0.3" filter="url(#strongGlow)"/>
    <circle cx="1050" cy="120" r="22" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="3"/>
    <text x="1050" y="125" text-anchor="middle" class="badge-text">CAE</text>
  </g>

  <g class="node-hpc" transform="translate(0,0)">
    <circle cx="1100" cy="280" r="28" fill="url(#cyanGrad)" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="1100" cy="280" r="18" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3"/>
    <text x="1100" y="284" text-anchor="middle" class="badge-text">CFD</text>
  </g>

  <!-- Center Decorative Glow -->
  <circle cx="600" cy="200" r="160" fill="url(#textGrad)" opacity="0.06" filter="url(#strongGlow)"/>

  <!-- Center Title Block -->
  <g text-anchor="middle">
    <!-- Header Badge -->
    <rect x="440" y="70" width="320" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="90" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#38bdf8" letter-spacing="1.5">PROCESS &amp; DATA MANAGEMENT ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="155" class="title-text" filter="url(#glow)">Awesome Simulation Process</text>
    <text x="600" y="205" class="title-text" filter="url(#glow)">Management</text>

    <!-- Subtitle -->
    <text x="600" y="250" class="sub-text">Curated SaaS Platforms &amp; Open-Source Tools for CAE Orchestration,</text>
    <text x="600" y="275" class="sub-text">HPC Job Scheduling, and Simulation Lifecycle Management</text>

    <!-- Feature Pills -->
    <g transform="translate(340, 310)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="65" y="18" font-family="sans-serif" font-weight="600" font-size="12" fill="#38bdf8">⚡ Cloud HPC</text>

      <rect x="145" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="210" y="18" font-family="sans-serif" font-weight="600" font-size="12" fill="#c084fc">📁 SPDM &amp; PLM</text>

      <rect x="290" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#4facfe" stroke-width="1"/>
      <text x="355" y="18" font-family="sans-serif" font-weight="600" font-size="12" fill="#4facfe">🔄 Workflows</text>
    </g>
  </g>
</svg>
